<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Counter-Slop 2 — Playbook</title>
    <!-- Inline so there is no favicon request to 404 on. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d1014'/%3E%3Cpath d='M7 24 L14 12 L20 18 L25 8' stroke='%2361d6c4' stroke-width='2.5' fill='none' stroke-linejoin='round'/%3E%3Ccircle cx='25' cy='8' r='3' fill='%23e0a33e'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">Playbook</div>
        <input id="play-name" class="play-name" spellcheck="false" aria-label="Play name" />
        <div class="topbar-group" id="map-group"></div>
        <div class="spacer"></div>
        <div class="topbar-group" id="file-group"></div>
      </header>

      <div id="body">
        <nav id="toolrail" aria-label="Tools"></nav>

        <main id="stage">
          <canvas id="map-canvas"></canvas>
          <canvas id="scene-canvas"></canvas>
          <div id="hint" class="hint"></div>
          <div id="toast" class="toast" role="status" aria-live="polite"></div>
        </main>

        <aside id="side">
          <section class="panel" id="roster-panel">
            <h2>Roster</h2>
            <div id="roster"></div>
          </section>
          <section class="panel" id="inspector-panel">
            <h2>Inspector</h2>
            <div id="inspector"></div>
          </section>
          <section class="panel" id="layers-panel">
            <h2>View</h2>
            <div id="layers"></div>
          </section>
        </aside>
      </div>

      <footer id="timeline"></footer>
    </div>

    <div id="overlay" class="overlay" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
